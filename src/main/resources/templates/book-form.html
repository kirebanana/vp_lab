<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${book != null} ? 'Edit Book' : 'Add Book'">Book Form</title>
    <style>
        body { width: 800px; margin: auto; font-family: Arial, sans-serif; }
        label { display:block; margin-top:8px; }
        input, select { width: 100%; padding:6px; box-sizing: border-box; }
        .actions { margin-top:12px; }
    </style>
</head>
<body>
<h1 th:text="${book != null} ? 'Edit Book' : 'Add Book'">Book Form</h1>
<form th:action="${book != null} ? @{/books/edit/{id}(id=${book.id})} : @{/books/add}" method="post">
    <label for="title">Title</label>
    <input id="title" name="title" type="text"
           th:value="${book != null ? book.title : ''}" required/>

    <label for="genre">Genre</label>
    <input id="genre" name="genre" type="text"
           th:value="${book != null ? book.genre : ''}" required/>

    <label for="averageRating">Rating</label>
    <input id="averageRating" name="averageRating" type="number" step="0.1" min="0" max="5"
           th:value="${book != null ? book.averageRating : ''}" required/>

    <label for="authorId">Author</label>
    <select id="authorId" name="authorId" required>
        <option value="" disabled th:if="${book == null}" selected>-- Select author --</option>
        <option th:each="author : ${authors}"
                th:value="${author.id}"
                th:text="${author.name + ' ' + author.surname}"
                th:selected="${book != null} ? author.id == book.author.id : false">
        </option>
    </select>
    <div class="actions">
        <button type="submit" th:text="${book != null} ? 'Save' : 'Add'">Submit</button>
        <a th:href="@{/books}" style="margin-left:10px;">Cancel</a>
    </div>
</form>
</body>
</html>
