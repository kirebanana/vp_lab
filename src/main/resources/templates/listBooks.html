<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Books</title>
    <style>
        body { width: 900px; margin: auto; font-family: Arial, sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .top-actions { margin-top: 12px; display:flex; justify-content: space-between; align-items: center; }
        .reservation { margin-top: 24px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
        .small { font-size: 0.9em; color:#555; }
        form.inline { display:inline; }
    </style>
</head>
<body>
<header>
    <h1>Books</h1>
</header>
<div class="top-actions">
    <form th:action="@{/books}" method="get" class="form-inline">
        <div class="input-group input-group-sm">
            <input name="searchText" type="text" class="form-control" placeholder="Book title..."/>
            <input name="searchRating" type="number" class="form-control" placeholder="Min rating" step="0.1" min="0" max="5"/>
            <div class="input-group-append">
                <button type="submit" class="btn btn-secondary btn-number"><i class="fa fa-search"></i></button>
            </div>
        </div>
    </form>

    <div>
        <a th:href="@{/books/book-form}">+ Add new book</a>
    </div>
</div>
<table>
    <thead>
    <tr>
        <th style="width:35%">Title</th>
        <th>Genre</th>
        <th>Rating</th>
        <th>Author</th>
        <th style="width:18%">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.genre}">Genre</td>
        <td th:text="${book.averageRating}">Rating</td>
        <td th:text="${book.author != null ? book.author.name + ' ' + book.author.surname : '—'}">Author</td>
        <td>
            <a th:href="@{/books/book-form/{id}(id=${book.id})}">Edit</a>
            <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" class="inline">
                <button type="submit" onclick="return confirm('Delete this book?');">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<section class="reservation">
    <h2>Reserve a book</h2>
    <form th:action="@{/bookReservation}" method="post">
        <div th:each="book : ${books}">
            <div>
                <input type="radio" name="bookTitle" th:id="${'book_' + book.id}" th:value="${book.title}" required/>
                <label th:for="${'book_' + book.id}" th:text="${'Title: ' + book.title + ', Genre: ' + book.genre + ', Rating: ' + book.averageRating}"></label>
            </div>
        </div>
        <div style="margin-top:10px;">
            <label class="small">Your name</label>
            <input type="text" name="readerName" required/>
        </div>
        <div style="margin-top:8px;">
            <label class="small">Your address</label>
            <input type="text" name="readerAddress" required/>
        </div>
        <div style="margin-top:8px;">
            <label class="small">Number of copies</label>
            <input type="number" name="numberOfCopies" min="1" max="10" required/>
        </div>
        <div style="margin-top:10px;">
            <button type="submit">Reserve Book</button>
        </div>
    </form>
</section>
</body>
</html>
